<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Documentation Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-900">
    <div class="min-h-screen flex">
      <aside class="w-72 bg-slate-900 text-white p-5 hidden md:block">
        <h1 class="text-2xl font-bold mb-8">AI Documentation Hub</h1>
        <nav class="space-y-2">
          <button class="nav-btn w-full text-left px-3 py-2 rounded bg-slate-700" data-section="prompts">Prompt Library</button>
          <button class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-slate-700" data-section="workflows">Workflow Docs</button>
          <button class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-slate-700" data-section="tools">Tool Directory</button>
          <button class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-slate-700" data-section="experiments">Experiment Logs</button>
          <button class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-slate-700" data-section="assistant">AI Assistant</button>
        </nav>
      </aside>

      <main class="flex-1 p-4 md:p-8">
        <header class="mb-6">
          <h2 class="text-3xl font-semibold">Dashboard</h2>
          <p class="text-slate-600">Manage prompts, workflows, tools, experiments, and AI automation.</p>
        </header>

        <section id="prompts" class="content-section grid gap-4">
          <div class="bg-white rounded-xl shadow p-5">
            <h3 class="font-semibold text-xl mb-3">Prompt Library</h3>
            <form id="prompt-form" class="grid gap-2 md:grid-cols-2 mb-4">
              <input name="title" class="border rounded p-2" placeholder="Prompt title" required />
              <input name="tags" class="border rounded p-2" placeholder="Tags (comma separated)" />
              <textarea name="content" class="border rounded p-2 md:col-span-2" placeholder="Prompt content" required></textarea>
              <button class="bg-blue-600 text-white px-4 py-2 rounded md:col-span-2">Add Prompt</button>
            </form>
            <div id="prompt-list" class="space-y-3"></div>
          </div>
        </section>

        <section id="workflows" class="content-section hidden grid gap-4">
          <div class="bg-white rounded-xl shadow p-5">
            <h3 class="font-semibold text-xl mb-3">Workflow Documentation</h3>
            <div id="workflow-list" class="space-y-3"></div>
          </div>
        </section>

        <section id="tools" class="content-section hidden grid gap-4">
          <div class="bg-white rounded-xl shadow p-5">
            <h3 class="font-semibold text-xl mb-3">Tool Directory</h3>
            <div id="tool-list" class="space-y-3"></div>
          </div>
        </section>

        <section id="experiments" class="content-section hidden grid gap-4">
          <div class="bg-white rounded-xl shadow p-5">
            <h3 class="font-semibold text-xl mb-3">Experiment Logs</h3>
            <div id="experiment-list" class="space-y-3"></div>
          </div>
        </section>

        <section id="assistant" class="content-section hidden grid gap-4">
          <div class="bg-white rounded-xl shadow p-5">
            <h3 class="font-semibold text-xl mb-3">AI Assistant</h3>
            <div class="grid gap-4 lg:grid-cols-3">
              <form class="assistant-form border rounded p-3" data-endpoint="/api/ai/improve-prompt">
                <h4 class="font-medium mb-2">Improve Prompt</h4>
                <textarea name="prompt" class="border rounded p-2 w-full mb-2" rows="5" placeholder="Paste prompt"></textarea>
                <button class="bg-indigo-600 text-white px-3 py-2 rounded">Run</button>
              </form>

              <form class="assistant-form border rounded p-3" data-endpoint="/api/ai/generate-workflow">
                <h4 class="font-medium mb-2">Generate Workflow</h4>
                <input name="goal" class="border rounded p-2 w-full mb-2" placeholder="Goal" />
                <textarea name="context" class="border rounded p-2 w-full mb-2" rows="4" placeholder="Context (optional)"></textarea>
                <button class="bg-indigo-600 text-white px-3 py-2 rounded">Run</button>
              </form>

              <form class="assistant-form border rounded p-3" data-endpoint="/api/ai/summarize-docs">
                <h4 class="font-medium mb-2">Summarize Docs</h4>
                <textarea name="text" class="border rounded p-2 w-full mb-2" rows="5" placeholder="Paste documentation"></textarea>
                <button class="bg-indigo-600 text-white px-3 py-2 rounded">Run</button>
              </form>
            </div>
            <div class="mt-4">
              <h4 class="font-medium">AI Output</h4>
              <pre id="assistant-output" class="bg-slate-100 rounded p-3 whitespace-pre-wrap text-sm"></pre>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
